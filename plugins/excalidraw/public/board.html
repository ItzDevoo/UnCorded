<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excalidraw Board</title>

  <link
    rel="stylesheet"
    href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css"
  />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    #root { width: 100%; height: 100vh; }

    .top-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 6px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      pointer-events: auto;
    }

    .top-bar a {
      color: #7c5cfc;
      text-decoration: none;
      font-weight: 500;
    }

    .top-bar a:hover { text-decoration: underline; }

    .user-count {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #4ade80;
      font-size: 12px;
    }

    .user-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }

    .status {
      font-size: 11px;
      color: #7a7a9a;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 1rem;
      z-index: 100;
    }
  </style>

  <script>
    window.EXCALIDRAW_ASSET_PATH =
      "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/";
  </script>
</head>
<body>
  <div id="root">
    <div class="loading-overlay" id="loading">Loading Excalidraw...</div>
  </div>

  <script type="module">
    import React, { useState, useCallback, useEffect, useRef } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0";

    // Extract board ID from URL: /board/:id
    const boardId = window.location.pathname.split("/board/")[1];
    if (!boardId) {
      document.getElementById("loading").textContent = "Invalid board URL";
      throw new Error("No board ID");
    }

    function App() {
      const [excalidrawAPI, setExcalidrawAPI] = useState(null);
      const [userCount, setUserCount] = useState(1);
      const [connected, setConnected] = useState(false);
      const wsRef = useRef(null);
      const suppressOnChange = useRef(false);
      const sendTimeoutRef = useRef(null);

      // Connect WebSocket
      useEffect(() => {
        const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${proto}//${window.location.host}/ws/room/${boardId}`;
        let ws;
        let reconnectTimer;

        function connect() {
          ws = new WebSocket(wsUrl);
          wsRef.current = ws;

          ws.onopen = () => {
            setConnected(true);
          };

          ws.onmessage = (event) => {
            try {
              const msg = JSON.parse(event.data);

              if (msg.type === "user-count") {
                setUserCount(msg.count);
                return;
              }

              if (msg.type === "scene-init" && excalidrawAPI) {
                suppressOnChange.current = true;
                excalidrawAPI.updateScene({
                  elements: msg.elements,
                  captureUpdate: "NEVER",
                });
                setTimeout(() => { suppressOnChange.current = false; }, 100);
                return;
              }

              if (msg.type === "scene-update" && excalidrawAPI) {
                suppressOnChange.current = true;
                excalidrawAPI.updateScene({
                  elements: msg.elements,
                  captureUpdate: "NEVER",
                });
                setTimeout(() => { suppressOnChange.current = false; }, 100);
              }
            } catch {
              // Non-JSON message, ignore
            }
          };

          ws.onclose = () => {
            setConnected(false);
            wsRef.current = null;
            // Reconnect after 2s
            reconnectTimer = setTimeout(connect, 2000);
          };

          ws.onerror = () => {
            ws.close();
          };
        }

        connect();

        return () => {
          clearTimeout(reconnectTimer);
          if (ws) ws.close();
        };
      }, [excalidrawAPI]);

      // Debounced scene broadcast
      const handleChange = useCallback((elements, appState, files) => {
        if (suppressOnChange.current) return;
        if (!wsRef.current || wsRef.current.readyState !== WebSocket.OPEN) return;

        // Debounce: send at most every 100ms
        if (sendTimeoutRef.current) return;
        sendTimeoutRef.current = setTimeout(() => {
          sendTimeoutRef.current = null;
          if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
            wsRef.current.send(JSON.stringify({
              type: "scene-update",
              elements: Array.from(elements),
            }));
          }
        }, 100);
      }, []);

      // Remove loading overlay once mounted
      useEffect(() => {
        const el = document.getElementById("loading");
        if (el) el.remove();
      }, []);

      return React.createElement(
        React.Fragment,
        null,
        React.createElement(
          "div",
          { className: "top-bar" },
          React.createElement("a", { href: "/" }, "All Boards"),
          React.createElement(
            "span",
            { className: "user-count" },
            React.createElement("span", { className: "user-dot" }),
            `${userCount} user${userCount !== 1 ? "s" : ""}`
          ),
          React.createElement(
            "span",
            { className: "status" },
            connected ? "Connected" : "Reconnecting..."
          )
        ),
        React.createElement(Excalidraw, {
          excalidrawAPI: (api) => setExcalidrawAPI(api),
          onChange: handleChange,
          theme: "dark",
          initialData: {
            appState: {
              viewBackgroundColor: "#1a1a2e",
            },
          },
        })
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
